<!DOCTYPE html>
<html lang="ko">
<head>
  <!-- han-pit-inline-update -->
<script id="han-pit-inline-update">
(function(){
  try{
    document.documentElement.style.backgroundColor="#060c17";
    document.documentElement.style.colorScheme="dark";
  }catch(e){}
  var BUILD="20260906044402";
  var KEY="hanPitAppVersion";
  var LAST_TARGET="hanPitReloadTarget";
  var meta=document.querySelector('meta[name="han-pit-build"]');
  var pageBuild=meta?String(meta.getAttribute("content")||"").trim():BUILD;
  var lastCheckAt=0;
  var checking=false;
  var swReloadGuard=false;

  function isPwaStandalone(){
    try{
      if(window.navigator.standalone===true)return true;
      if(window.matchMedia){
        if(window.matchMedia("(display-mode: standalone)").matches)return true;
        if(window.matchMedia("(display-mode: fullscreen)").matches)return true;
      }
    }catch(e){}
    return false;
  }

  function isMobileDevice(){
    try{
      return /Android|iPhone|iPad|iPod/i.test(window.navigator.userAgent||"");
    }catch(e){return false;}
  }

  var IS_PWA=isPwaStandalone();
  var IS_FAST_UPDATE=IS_PWA||isMobileDevice();
  var MIN_CHECK_MS=IS_FAST_UPDATE?500:15000;
  var POLL_MS=IS_FAST_UPDATE?5000:60000;
  var BOOT_CHECK_MS=IS_FAST_UPDATE?100:3000;

  function swScope(){
    var p=location.pathname||"/";
    var i=p.lastIndexOf("/");
    var b=i<0?"/":p.slice(0,i+1);
    return b.endsWith("/")?b:b+"/";
  }

  function persist(ver){
    if(!ver)return;
    try{localStorage.setItem(KEY,String(ver));}catch(e){}
  }

  function syncBustParam(ver){
    if(!ver)return;
    var loc=new URL(location.href);
    if(loc.searchParams.get("_hanpit_v")===ver)return;
    loc.searchParams.set("_hanpit_v",ver);
    try{history.replaceState(null,"",loc.toString());}catch(e){}
  }

  function lastTarget(){
    try{return sessionStorage.getItem(LAST_TARGET)||"";}catch(e){return "";}
  }
  function setLastTarget(ver){
    try{sessionStorage.setItem(LAST_TARGET,String(ver||""));}catch(e){}
  }

  function reloadTo(ver){
    ver=String(ver||"").trim();
    if(!ver||ver===pageBuild)return;
    if(!IS_PWA&&lastTarget()===ver)return;
    setLastTarget(ver);
    persist(ver);
    var loc=new URL(location.href);
    loc.searchParams.set("_hanpit_v",ver);
    if(IS_PWA)loc.searchParams.set("_hanpit_pwa",String(Date.now()));
    location.replace(loc.toString());
  }

  function syncManifestForPwa(){
    if(!IS_PWA)return Promise.resolve();
    return fetch("./manifest.json?t="+Date.now(),{cache:"no-store",credentials:"same-origin"})
      .then(function(r){return r.ok?r.json():null;})
      .then(function(m){
        if(!m)return;
        var start=String(m.start_url||"").trim();
        if(start){
          try{localStorage.setItem("hanPitManifestStartUrl",start);}catch(e){}
        }
      })
      .catch(function(){});
  }

  if(pageBuild){
    persist(pageBuild);
    syncBustParam(pageBuild);
  }

  function activateWaitingWorker(worker){
    if(!worker)return;
    try{
      if(typeof worker.postMessage==="function"){
        worker.postMessage({type:"HAN_PIT_SKIP_WAITING"});
      }
    }catch(e){}
    try{
      if(typeof worker.skipWaiting==="function")worker.skipWaiting();
    }catch(e){}
  }

  function wireSwRegistration(reg){
    if(!reg||reg.__hanPitUpdateWired)return;
    reg.__hanPitUpdateWired=true;
    if(reg.waiting)activateWaitingWorker(reg.waiting);
    reg.addEventListener("updatefound",function(){
      var installing=reg.installing;
      if(!installing)return;
      installing.addEventListener("statechange",function(){
        if(installing.state!=="installed")return;
        if(reg.waiting)activateWaitingWorker(reg.waiting);
        if(navigator.serviceWorker.controller)checkRemoteVersion(true);
      });
    });
  }

  function registerSwOnly(){
    if(!("serviceWorker" in navigator))return;
    var run=function(){
      navigator.serviceWorker.register("./firebase-messaging-sw.js",{scope:swScope()})
        .then(function(reg){
          wireSwRegistration(reg);
          if(typeof reg.update==="function")reg.update();
        })
        .catch(function(){});
    };
    if(IS_PWA){
      run();
      return;
    }
    if(typeof requestIdleCallback==="function"){
      requestIdleCallback(run,{timeout:8000});
    }else{
      setTimeout(run,2000);
    }
  }

  function updateSw(){
    if(!("serviceWorker" in navigator)||!navigator.serviceWorker.getRegistration)return;
    navigator.serviceWorker.getRegistration().then(function(reg){
      if(reg&&typeof reg.update==="function"){
        var p=reg.update();
        if(p&&typeof p.catch==="function")p.catch(function(){});
      }
      if(reg)wireSwRegistration(reg);
    }).catch(function(){});
  }

  function checkRemoteVersion(force){
    if(!pageBuild||checking)return;
    var host=String(location.hostname||"").toLowerCase();
    if(host==="localhost"||host==="127.0.0.1"||host==="0.0.0.0")return;
    var now=Date.now();
    if(!force&&now-lastCheckAt<MIN_CHECK_MS)return;
    lastCheckAt=now;
    checking=true;
    fetch("./app-version.json?t="+now,{cache:"no-store",credentials:"same-origin"})
      .then(function(r){return r.ok?r.json():null;})
      .then(function(d){
        checking=false;
        var remote=String((d&&(d.v||d.version))||"").trim();
        if(!remote||remote===pageBuild){
          if(remote)persist(remote);
          syncBustParam(remote||pageBuild);
          return syncManifestForPwa();
        }
        updateSw();
        reloadTo(remote);
        return syncManifestForPwa();
      })
      .catch(function(){checking=false;});
  }

  function onResume(force){
    if(document.visibilityState==="hidden")return;
    updateSw();
    checkRemoteVersion(force===true||IS_PWA);
  }

  // 출근하기처럼 되돌리기 어려운 중요한 쓰기 직전에, 백그라운드 폴링을 기다리지 않고
  // 즉시 한 번 더 버전을 확인한다 — 오래 열어둔 탭이 자동 갱신을 놓쳤어도 여기서 걸러낸다.
  function ensureFreshBuild(){
    var host=String(location.hostname||"").toLowerCase();
    if(!pageBuild||host==="localhost"||host==="127.0.0.1"||host==="0.0.0.0"){
      return Promise.resolve(true);
    }
    return fetch("./app-version.json?t="+Date.now(),{cache:"no-store",credentials:"same-origin"})
      .then(function(r){return r.ok?r.json():null;})
      .then(function(d){
        var remote=String((d&&(d.v||d.version))||"").trim();
        if(!remote||remote===pageBuild)return true;
        updateSw();
        reloadTo(remote);
        return false;
      })
      .catch(function(){return true;});
  }
  window.hanPitEnsureFreshBuild=ensureFreshBuild;

  if("serviceWorker" in navigator){
    navigator.serviceWorker.addEventListener("controllerchange",function(){
      if(swReloadGuard)return;
      swReloadGuard=true;
      updateSw();
      checkRemoteVersion(true);
      if(IS_PWA){
        setTimeout(function(){
          try{
            var stored=localStorage.getItem(KEY)||"";
            if(stored&&stored!==pageBuild)reloadTo(stored);
          }catch(e){}
        },300);
      }
    });
    navigator.serviceWorker.addEventListener("message",function(ev){
      var msg=ev&&ev.data;
      if(!msg||msg.type!=="HAN_PIT_SW_ACTIVATED")return;
      onResume(true);
    });
  }

  registerSwOnly();
  if(IS_PWA)void syncManifestForPwa();
  setTimeout(function(){checkRemoteVersion(true);},BOOT_CHECK_MS);
  setInterval(function(){
    if(document.visibilityState!=="hidden")checkRemoteVersion(false);
  },POLL_MS);
  document.addEventListener("visibilitychange",function(){onResume(true);});
  window.addEventListener("pageshow",function(){onResume(true);});
  window.addEventListener("focus",function(){onResume(true);});
})();
</script>

  <!-- han-pit-asset-fix -->
  <script id="han-pit-asset-fix">
(function(){
  function appBase(){
    var p=location.pathname||"/";
    var i=p.lastIndexOf("/");
    return i<0?"/":p.slice(0,i+1);
  }
  function appUrl(rel){
    rel=String(rel||"").replace(/^\.\//,"");
    return location.origin+appBase()+rel;
  }
  function applyMarks(){
    var meta=document.querySelector('meta[name="han-pit-build"]');
    var tag=meta?String(meta.getAttribute("content")||"").trim():"";
    var q=tag?"?v="+encodeURIComponent(tag):"";
    var url=appUrl("icons/han-pit-wordmark.png")+q;
    document.querySelectorAll("img.app-mark-img").forEach(function(img){
      if(img.getAttribute("src")!==url)img.setAttribute("src",url);
    });
  }
  if(document.readyState==="loading"){
    document.addEventListener("DOMContentLoaded",applyMarks);
  }else{
    applyMarks();
  }
})();
</script>

<script id="han-pit-boot-dismiss">
(function(){
  function dismiss(){
    var list=document.querySelectorAll(".page-boot-loading,.page-boot-text");
    for(var i=0;i<list.length;i++)list[i].remove();
    ["indexRoot","eventList","app"].forEach(function(id){
      var el=document.getElementById(id);
      if(el)el.dataset.pageBootLoaded="1";
    });
  }
  window.setTimeout(dismiss,15000);
})();
</script>
