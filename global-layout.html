<!DOCTYPE html>
<html lang="ko">
<head>
  <!-- han-pit-inline-update -->
<script id="han-pit-inline-update">
(function(){
  try{
    document.documentElement.style.backgroundColor="#060c17";
    document.documentElement.style.colorScheme="dark";
  }catch(e){}
  var BUILD="20260531110202";
  var KEY="hanPitAppVersion";
  var meta=document.querySelector('meta[name="han-pit-build"]');
  var pageBuild=meta?String(meta.getAttribute("content")||"").trim():"";
  var loc=new URL(location.href);
  var bust=loc.searchParams.get("_hanpit_v")||"";

  function appBase(){
    var p=location.pathname||"/";
    var i=p.lastIndexOf("/");
    return i<0?"/":p.slice(0,i+1);
  }
  function appUrl(rel){
    rel=String(rel||"").replace(/^\.\//,"");
    return location.origin+appBase()+rel;
  }

  function isLegacyShell(){
    var onIndex=document.getElementById("indexRoot")||document.getElementById("dealerOpsMount");
    return !!onIndex&&!document.getElementById("workSummaryModal");
  }

  function persist(v){
    try{localStorage.setItem(KEY,v);}catch(e){}
  }

  function reload(v){
    var tag=v||String(Date.now());
    if(loc.searchParams.get("_hanpit_v")===tag&&pageBuild&&pageBuild===tag)return;
    var n=0;
    try{n=Number(sessionStorage.getItem("hanPitReloadAttempt:"+tag)||0);}catch(e){}
    var cap=isLegacyShell()||!pageBuild?12:4;
    if(n>=cap)return;
    try{sessionStorage.setItem("hanPitReloadAttempt:"+tag,String(n+1));}catch(e){}
    if(v)persist(v);
    loc.searchParams.set("_hanpit_v",tag);
    location.replace(loc.toString());
  }

  function isPlaceholderBust(v){
    v=String(v||"").trim();
    return !v||v==="boot"||v==="net";
  }

  function syncBustInPlace(remote){
    if(!remote||!pageBuild||pageBuild!==remote)return;
    if(!isPlaceholderBust(bust)&&bust===remote)return;
    persist(remote);
    loc.searchParams.set("_hanpit_v",remote);
    try{history.replaceState(null,"",loc.toString());}catch(e){}
  }

  function needsReload(remote){
    if(isLegacyShell())return true;
    if(!pageBuild)return true;
    if(!remote)return false;
    if(bust===remote&&pageBuild===remote)return false;
    var stored="";
    try{stored=String(localStorage.getItem(KEY)||"").trim();}catch(e){}
    if(pageBuild!==remote)return true;
    if(stored!==remote)return true;
    if(!stored)return true;
    if(bust&&bust!==remote)return true;
    return false;
  }

  if(!pageBuild&&!bust){
    reload("boot");
    return;
  }

  fetch(appUrl("app-version.json")+"?t="+Date.now(),{cache:"no-store",credentials:"same-origin"})
    .then(function(r){return r.ok?r.json():null;})
    .then(function(d){
      var remote=String((d&&(d.v||d.version))||"").trim();
      if(needsReload(remote))reload(remote);
      else syncBustInPlace(remote);
    })
    .catch(function(){
      if(isLegacyShell()||!pageBuild)reload("net");
    });

  if("serviceWorker" in navigator){
    navigator.serviceWorker.register(appUrl("firebase-messaging-sw.js"),{scope:appBase()})
      .then(function(reg){return reg.update();})
      .catch(function(){});
    navigator.serviceWorker.addEventListener("message",function(ev){
      var d=ev&&ev.data;
      if(d&&d.type==="HAN_PIT_FORCE_RELOAD")reload(String(d.v||"").trim());
    });
  }
})();
</script>
  <!-- /han-pit-inline-update -->
  <!-- han-pit-critical-shell -->

  <!-- han-pit-asset-fix -->
  <script id="han-pit-asset-fix">
(function(){
  function appBase(){
    var p=location.pathname||"/";
    var i=p.lastIndexOf("/");
    return i<0?"/":p.slice(0,i+1);
  }
  function appUrl(rel){
    rel=String(rel||"").replace(/^\.\//,"");
    return location.origin+appBase()+rel;
  }
  function applyMarks(){
    var meta=document.querySelector('meta[name="han-pit-build"]');
    var tag=meta?String(meta.getAttribute("content")||"").trim():"";
    var q=tag?"?v="+encodeURIComponent(tag):"";
    var url=appUrl("icons/han-pit-wordmark.png")+q;
    document.querySelectorAll("img.app-mark-img").forEach(function(img){
      if(img.getAttribute("src")!==url)img.setAttribute("src",url);
    });
  }
  if(document.readyState==="loading"){
    document.addEventListener("DOMContentLoaded",applyMarks);
  }else{
    applyMarks();
  }
})();
</script>
  <!-- /han-pit-asset-fix -->
  <meta name="han-pit-build" content="20260531110202" />
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Han Pit - Global Layout</title>
  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" type="image/png" sizes="32x32" href="./icons/favicon-32.png" />
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
  <meta name="theme-color" content="#111832" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <link rel="stylesheet" href="./css/layout.css?v=20260531110202" />
  <link rel="stylesheet" href="./css/global-layout.css?v=20260531110202" />
</head>
<body class="page-global-layout">
  <header class="topbar">
    <div class="top-left">
      <a class="app-mark logo logo--mark" href="./hub.html" aria-label="Han Pit Hub">
        <img
          class="app-mark-img"
          src="./icons/han-pit-wordmark.png?v=3"
          alt="Han Pit"
          width="220"
          height="55"
          decoding="async"
        />
      </a>
      <button id="menuBtn" class="icon-btn" aria-label="menu">≡</button>
    </div>

    <div class="top-right">
      <div id="canvasZoomBar" class="layout-canvas-zoom-bar layout-canvas-zoom-bar--topbar" role="toolbar" aria-label="캔버스 보기"></div>
      <button id="enablePushBtn" class="pill-btn" type="button">알림 켜기</button>
      <button id="backBtn" class="pill-btn" type="button">Back</button>
    </div>
  </header>

  <main id="app">
    <div class="page-boot-loading" role="status" aria-live="polite">
      <div class="page-boot-spinner" aria-hidden="true"></div>
      <p class="page-boot-text">통합 배치도 불러오는 중…</p>
    </div>
  </main>

  <aside id="pcPanel" class="pc-panel" aria-label="panel">
    <div class="tabs global-pc-ops-tabs" aria-hidden="true" hidden>
      <button class="tab active" data-tab="wait">대기</button>
      <button class="tab" data-tab="seat">배치</button>
    </div>
    <div class="panel-body">
      <div id="metaStats" class="global-meta">
        <div class="global-meta-left">
          <span id="seatCount" class="hint-pill">SEAT: 0</span>
          <span id="assignedCount" class="hint-pill">ASSIGNED: 0</span>
          <span id="waitingCount" class="hint-pill">WAIT: 0</span>
          <span id="blockedCount" class="hint-pill hint-pill--block">BLOCK: 0</span>
        </div>
        <div id="globalMetaSeatActions" class="global-meta-actions hidden" aria-hidden="true">
          <button type="button" id="globalUndoToolbarBtn" class="pill-inline seat-meta-btn seat-meta-btn--undo seat-meta-btn--history" disabled aria-label="되돌리기" title="되돌릴 작업이 없습니다">←</button>
          <button type="button" id="globalRedoToolbarBtn" class="pill-inline seat-meta-btn seat-meta-btn--redo seat-meta-btn--history" disabled aria-label="앞으로돌리기" title="앞으로 돌릴 작업이 없습니다">→</button>
        </div>
      </div>
      <div id="panelContent"></div>
    </div>
  </aside>

  <div id="mobileSheet" class="mobile-sheet" aria-label="mobile sheet">
    <button id="mobileAddSeat" class="sheet-btn" type="button">+ Seat 추가</button>
    <button id="mobileAddWaiting" class="sheet-btn ghost" type="button">+ 대기 추가</button>
  </div>

  <div id="globalSeatEditModal" class="global-seat-edit-modal" aria-hidden="true">
    <div class="global-seat-edit-modal__backdrop" data-close-seat-edit aria-hidden="true"></div>
    <div
      class="global-seat-edit-modal__card"
      role="dialog"
      aria-modal="true"
      aria-labelledby="globalSeatEditTitle"
    >
      <h2 id="globalSeatEditTitle" class="global-seat-edit-modal__title">Seat 수정</h2>
      <p class="global-seat-edit-modal__hint">
        <strong>카드</strong>는 목록에서 다른 이벤트 카드로 바꿀 수 있고, <strong>Box ID</strong>는 필요 시 수정할 수 있습니다. 카드/Box를 바꾸면 저장 후
        <code>layout.html</code> 배치로 이동할지 묻습니다.
      </p>
      <p class="global-seat-edit-modal__meta global-seat-edit-modal__meta--id">
        Seat ID: <code id="globalSeatEditSeatIdDisplay"></code>
      </p>
      <div class="global-seat-edit-modal__fields">
        <label class="global-seat-edit-modal__label" for="globalSeatEditLabel">Seat 라벨</label>
        <input
          id="globalSeatEditLabel"
          class="global-seat-edit-modal__input"
          type="text"
          autocomplete="off"
          maxlength="16"
          placeholder="-"
        />
        <label class="global-seat-edit-modal__label" id="globalSeatEditEventLabel" for="globalSeatEditEventTrigger">카드 (이벤트)</label>
        <div class="global-seat-edit-modal__eventpick" id="globalSeatEditEventPick">
          <input type="hidden" id="globalSeatEditEventId" value="" autocomplete="off" />
          <button
            type="button"
            class="global-seat-edit-modal__select-trigger"
            id="globalSeatEditEventTrigger"
            aria-haspopup="listbox"
            aria-expanded="false"
            aria-labelledby="globalSeatEditEventLabel"
            aria-label="카드 ID 선택"
          >
            <span
              class="global-seat-edit-modal__select-trigger-text global-seat-edit-modal__select-trigger-text--mono"
              id="globalSeatEditEventTriggerText"
              aria-hidden="true"
            >카드 ID 선택 ▾</span>
          </button>
          <ul class="global-seat-edit-modal__select-list" id="globalSeatEditEventList" role="listbox" hidden></ul>
        </div>
        <label class="global-seat-edit-modal__label" for="globalSeatEditBoxId">Box ID</label>
        <input
          id="globalSeatEditBoxId"
          class="global-seat-edit-modal__input global-seat-edit-modal__input--mono"
          type="text"
          autocomplete="off"
          placeholder="-"
        />
      </div>
      <div class="global-seat-edit-modal__actions">
        <button type="button" class="global-seat-edit-modal__btn" data-close-seat-edit>취소</button>
        <button type="button" class="global-seat-edit-modal__btn global-seat-edit-modal__btn--primary" id="globalSeatEditSave">
          저장
        </button>
      </div>
    </div>
  </div>

  <div id="globalMobileSeatAddModal" class="global-seat-edit-modal" aria-hidden="true">
    <div class="global-seat-edit-modal__backdrop" data-close-mobile-seat-add aria-hidden="true"></div>
    <div
      class="global-seat-edit-modal__card"
      role="dialog"
      aria-modal="true"
      aria-labelledby="globalMobileSeatAddTitle"
    >
      <h2 id="globalMobileSeatAddTitle" class="global-seat-edit-modal__title">Seat 추가</h2>
      <p class="global-seat-edit-modal__hint">
        <strong>카드 ID</strong>는 index「카드 관리」에 보이는 값입니다. <strong>Box ID</strong>는 layout 주소창의
        <code>boxId</code>와 같아야 합니다.
      </p>
      <div class="global-seat-edit-modal__fields">
        <label class="global-seat-edit-modal__label" for="globalMobileSeatAddLabel">Seat 라벨</label>
        <input
          id="globalMobileSeatAddLabel"
          class="global-seat-edit-modal__input"
          type="text"
          autocomplete="off"
          maxlength="16"
          placeholder="예: 1, A1"
        />
        <label class="global-seat-edit-modal__label" id="globalMobileSeatAddEventLabel" for="globalMobileSeatAddEventTrigger">카드 ID</label>
        <div class="global-seat-edit-modal__eventpick" id="globalMobileSeatAddEventPick">
          <input type="hidden" id="globalMobileSeatAddEventId" value="" autocomplete="off" />
          <button
            type="button"
            class="global-seat-edit-modal__select-trigger"
            id="globalMobileSeatAddEventTrigger"
            aria-haspopup="listbox"
            aria-expanded="false"
            aria-labelledby="globalMobileSeatAddEventLabel"
            aria-label="카드 ID 선택"
          >
            <span
              class="global-seat-edit-modal__select-trigger-text global-seat-edit-modal__select-trigger-text--mono"
              id="globalMobileSeatAddEventTriggerText"
              aria-hidden="true"
            >카드 선택 ▾</span>
          </button>
          <ul class="global-seat-edit-modal__select-list" id="globalMobileSeatAddEventList" role="listbox" hidden></ul>
        </div>
        <label class="global-seat-edit-modal__label" for="globalMobileSeatAddBoxId">Box ID</label>
        <input
          id="globalMobileSeatAddBoxId"
          class="global-seat-edit-modal__input global-seat-edit-modal__input--mono"
          type="text"
          autocomplete="off"
          placeholder="-"
        />
      </div>
      <div class="global-seat-edit-modal__actions">
        <button type="button" class="global-seat-edit-modal__btn" data-close-mobile-seat-add>취소</button>
        <button
          type="button"
          class="global-seat-edit-modal__btn global-seat-edit-modal__btn--primary"
          id="globalMobileSeatAddSubmit"
        >
          추가
        </button>
      </div>
    </div>
  </div>

  <script type="module" src="./js/global-layout.js?v=20260531110202"></script>
</body>
</html>
