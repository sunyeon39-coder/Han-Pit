<!DOCTYPE html>
<html lang="ko">
<head>
  <!-- han-pit-inline-update -->
<script id="han-pit-inline-update">
(function(){
  try{
    document.documentElement.style.backgroundColor="#060c17";
    document.documentElement.style.colorScheme="dark";
  }catch(e){}
  var BUILD="20260530113014";
  var KEY="hanPitAppVersion";
  var meta=document.querySelector('meta[name="han-pit-build"]');
  var pageBuild=meta?String(meta.getAttribute("content")||"").trim():"";
  var loc=new URL(location.href);
  var bust=loc.searchParams.get("_hanpit_v")||"";

  function appBase(){
    var p=location.pathname||"/";
    var i=p.lastIndexOf("/");
    return i<0?"/":p.slice(0,i+1);
  }
  function appUrl(rel){
    rel=String(rel||"").replace(/^\.\//,"");
    return location.origin+appBase()+rel;
  }

  function isLegacyShell(){
    var onIndex=document.getElementById("indexRoot")||document.getElementById("dealerOpsMount");
    return !!onIndex&&!document.getElementById("workSummaryModal");
  }

  function persist(v){
    try{localStorage.setItem(KEY,v);}catch(e){}
  }

  function reload(v){
    var tag=v||String(Date.now());
    if(loc.searchParams.get("_hanpit_v")===tag&&pageBuild&&pageBuild===tag)return;
    var n=0;
    try{n=Number(sessionStorage.getItem("hanPitReloadAttempt:"+tag)||0);}catch(e){}
    var cap=isLegacyShell()||!pageBuild?12:4;
    if(n>=cap)return;
    try{sessionStorage.setItem("hanPitReloadAttempt:"+tag,String(n+1));}catch(e){}
    if(v)persist(v);
    loc.searchParams.set("_hanpit_v",tag);
    location.replace(loc.toString());
  }

  function needsReload(remote){
    if(isLegacyShell())return true;
    if(!pageBuild)return true;
    if(!remote)return false;
    if(bust===remote&&pageBuild===remote)return false;
    var stored="";
    try{stored=String(localStorage.getItem(KEY)||"").trim();}catch(e){}
    if(pageBuild!==remote)return true;
    if(stored!==remote)return true;
    if(!stored)return true;
    if(bust&&bust!==remote)return true;
    return false;
  }

  if(!pageBuild&&!bust){
    reload("boot");
    return;
  }

  fetch(appUrl("app-version.json")+"?t="+Date.now(),{cache:"no-store",credentials:"same-origin"})
    .then(function(r){return r.ok?r.json():null;})
    .then(function(d){
      var remote=String((d&&(d.v||d.version))||"").trim();
      if(needsReload(remote))reload(remote);
    })
    .catch(function(){
      if(isLegacyShell()||!pageBuild)reload("net");
    });

  if("serviceWorker" in navigator){
    navigator.serviceWorker.register(appUrl("firebase-messaging-sw.js"),{scope:appBase()})
      .then(function(reg){return reg.update();})
      .catch(function(){});
    navigator.serviceWorker.addEventListener("message",function(ev){
      var d=ev&&ev.data;
      if(d&&d.type==="HAN_PIT_FORCE_RELOAD")reload(String(d.v||"").trim());
    });
  }
})();
</script>
  <!-- /han-pit-inline-update -->
  <!-- han-pit-critical-shell -->

  <!-- /han-pit-critical-shell -->
  <!-- han-pit-asset-fix -->
  <script id="han-pit-asset-fix">
(function(){
  function appBase(){
    var p=location.pathname||"/";
    var i=p.lastIndexOf("/");
    return i<0?"/":p.slice(0,i+1);
  }
  function appUrl(rel){
    rel=String(rel||"").replace(/^\.\//,"");
    return location.origin+appBase()+rel;
  }
  function applyMarks(){
    var meta=document.querySelector('meta[name="han-pit-build"]');
    var tag=meta?String(meta.getAttribute("content")||"").trim():"";
    var q=tag?"?v="+encodeURIComponent(tag):"";
    var url=appUrl("icons/han-pit-wordmark.png")+q;
    document.querySelectorAll("img.app-mark-img").forEach(function(img){
      if(img.getAttribute("src")!==url)img.setAttribute("src",url);
    });
  }
  if(document.readyState==="loading"){
    document.addEventListener("DOMContentLoaded",applyMarks);
  }else{
    applyMarks();
  }
})();
</script>
  <!-- /han-pit-asset-fix -->
  <meta name="han-pit-build" content="20260530113014" />
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HAN Pit Login</title>
  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" type="image/png" sizes="32x32" href="./icons/favicon-32.png" />
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
  <meta name="theme-color" content="#111832" />
  <link rel="stylesheet" href="./css/login.css?v=20260530113014" />
  <link rel="stylesheet" href="./css/add-to-home-hint.css?v=20260530113014" />
</head>
<body>

  <div id="inAppBrowserGate" class="in-app-gate hidden" role="alert" aria-live="polite">
    <div class="in-app-gate-card">
      <h2 class="in-app-gate-title">인앱 브라우저에서는 Google 로그인이 제한됩니다</h2>
      <p class="in-app-gate-text">
        카카오톡·라인·네이버 등 앱 안에서 열면 Google 보안 정책(403)으로 로그인할 수 없습니다.
        <strong>Chrome</strong>(Android) 또는 <strong>Safari</strong>(iPhone)에서 이 주소를 다시 열어 주세요.
      </p>
      <div class="in-app-gate-actions">
        <button id="openInChromeBtn" class="login-btn in-app-gate-primary" type="button">Chrome / Safari로 열기</button>
        <button id="copyLoginUrlBtn" class="login-btn in-app-gate-ghost" type="button">주소 복사</button>
      </div>
    </div>
  </div>

  <div class="login-wrap">
    <div class="login-card">
      <h1 class="logo logo--mark">
        <img
          class="app-mark-img"
          src="./icons/han-pit-wordmark.png"
          alt="Han Pit"
          width="400"
          height="100"
          decoding="async"
          fetchpriority="high"
        />
      </h1>
      <p class="subtitle">Dealer & Table Management</p>

      <button id="googleLogin" class="login-btn" type="button">
        Google로 로그인
      </button>

      <p class="login-desc">
        Google 계정으로 간편하게 로그인하세요
      </p>
    </div>
  </div>

  <div id="loginBusyOverlay" class="login-busy hidden" role="status" aria-live="polite" aria-hidden="true">
    <div class="login-busy-card">
      <div class="login-busy-spinner" aria-hidden="true"></div>
      <p id="loginBusyText" class="login-busy-text">Google 계정 연결 중…</p>
    </div>
  </div>

  <!-- 첫 로그인 정보 입력 모달 -->
  <div id="signupModal" class="signup-modal hidden">
    <div class="signup-card">
      <h2>기본 정보를 입력해주세요</h2>

      <div class="input-box">
        <input id="nicknameInput" type="text" placeholder="-" maxlength="7" />
      </div>

      <div class="gender-box">
        <button class="gender-btn" type="button" data-gender="male">남성</button>
        <button class="gender-btn" type="button" data-gender="female">여성</button>
        <button class="gender-btn active" type="button" data-gender="none">미선택</button>
      </div>

      <div class="input-box">
        <input id="phoneInput" type="text" placeholder="-" />
      </div>

      <button id="signupConfirm" class="login-btn" type="button">
        확인
      </button>
    </div>
  </div>

  <script type="module" src="./js/login.js?v=20260530113014"></script>
</body>
</html>
