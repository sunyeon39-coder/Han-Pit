<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HAN Pit Login</title>
  <link rel="manifest" href="./manifest.json" />
  <meta name="theme-color" content="#111832" />
  <link rel="stylesheet" href="./css/login.css" />
</head>
<body>

  <div id="inAppBrowserGate" class="in-app-gate hidden" role="alert" aria-live="polite">
    <div class="in-app-gate-card">
      <h2 class="in-app-gate-title">인앱 브라우저에서는 Google 로그인이 제한됩니다</h2>
      <p class="in-app-gate-text">
        카카오톡·라인·네이버 등 앱 안에서 열면 Google 보안 정책(403)으로 로그인할 수 없습니다.
        <strong>Chrome</strong> 또는 <strong>삼성 인터넷</strong>에서 이 주소를 다시 열어 주세요.
      </p>
      <div class="in-app-gate-actions">
        <button id="openInChromeBtn" class="login-btn in-app-gate-primary" type="button">Chrome으로 열기</button>
        <button id="openInSamsungBtn" class="login-btn in-app-gate-secondary" type="button">삼성 인터넷으로 열기</button>
        <button id="copyLoginUrlBtn" class="login-btn in-app-gate-ghost" type="button">주소 복사</button>
      </div>
    </div>
  </div>

  <div class="login-wrap">
    <div class="login-card">
      <h1 class="logo">HAN Pit</h1>
      <p class="subtitle">Dealer & Table Management</p>

      <button id="googleLogin" class="login-btn" type="button">
        Google로 로그인
      </button>

      <p class="login-desc">
        Google 계정으로 간편하게 로그인하세요
      </p>
    </div>
  </div>

  <!-- 첫 로그인 정보 입력 모달 -->
  <div id="signupModal" class="signup-modal hidden">
    <div class="signup-card">
      <h2>기본 정보를 입력해주세요</h2>

      <div class="input-box">
        <input id="nicknameInput" type="text" placeholder="-" maxlength="7" />
      </div>

      <div class="gender-box">
        <button class="gender-btn" type="button" data-gender="male">남성</button>
        <button class="gender-btn" type="button" data-gender="female">여성</button>
        <button class="gender-btn active" type="button" data-gender="none">미선택</button>
      </div>

      <div class="input-box">
        <input id="phoneInput" type="text" placeholder="-" />
      </div>

      <button id="signupConfirm" class="login-btn" type="button">
        확인
      </button>
    </div>
  </div>

  <script type="module" src="./js/login.js"></script>
</body>
</html>
