<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Han Pit — 이동 중</title>
  <link rel="icon" type="image/png" sizes="32x32" href="./icons/favicon-32.png" />
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
  <script>
    (function () {
      var l = window.location;
      var parts = (l.pathname || "/").split("/").filter(function (p) {
        return !!p;
      });
      var gh = /\.github\.io$/i.test(l.hostname || "");
      var target;
      if (gh && parts.length >= 2) {
        target = l.origin + "/" + parts[0] + "/index.html" + (l.search || "");
      } else if (gh && parts.length === 1 && !/\.html$/i.test(parts[0])) {
        target = l.origin + "/" + parts[0] + "/index.html" + (l.search || "");
      } else {
        try {
          target = new URL("./index.html", l.href).href;
        } catch (e) {
          target = "index.html";
        }
      }
      l.replace(target);
    })();
  </script>
  <meta http-equiv="refresh" content="0;url=index.html" />
</head>
<body>
  <p><a href="index.html">Han Pit 홈으로 이동</a></p>
</body>
</html>
